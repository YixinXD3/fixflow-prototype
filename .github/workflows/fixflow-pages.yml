name: Deploy FixFlow to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'apps/fixflow/public/**'
      - '.github/workflows/fixflow-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixflow-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check apps/fixflow/public/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/fixflow/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
