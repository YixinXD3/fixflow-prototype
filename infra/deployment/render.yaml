# Creates a paid service and disk. Review the platform's price before approving.
services:
  - type: web
    name: fixflow
    runtime: docker
    dockerfilePath: ./infra/containers/fixflow.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: FIXFLOW_ENV
        value: production
      - key: FIXFLOW_DB
        value: /app/storage/fixflow.sqlite3
      - key: FIXFLOW_PUBLIC_ORIGIN
        sync: false
      - key: FIXFLOW_ADMIN_EMAIL
        sync: false
      - key: FIXFLOW_ADMIN_PASSWORD
        sync: false
    disk:
      name: fixflow-data
      mountPath: /app/storage
      sizeGB: 1
